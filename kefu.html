<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 客诉应对助手 </title>
       作者：李川，有疑问企业微信联系我
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563EB; /* 更接近截图的蓝色 */
            --secondary: #6AD2FF;
            --bg-color: #F4F7FE;
        }

        body {
            font-family: 'Plus Jakarta Sans', "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #2B3674;
            -webkit-overflow-scrolling: touch;
        }

        /* 现代卡片风格 */
        .modern-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0px 4px 20px rgba(112, 144, 176, 0.08);
            border: none;
            transition: all 0.3s ease;
        }

        /* 输入框风格 */
        .modern-input {
            background-color: #F8F9FC;
            border: 1px solid transparent;
            border-radius: 12px;
            color: #2B3674;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 14px; 
        }
        
        .modern-input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .modern-input::placeholder { color: #A3AED0; }

        /* 按钮风格 - 实心蓝 */
        .btn-primary {
            background: #2563EB;
            border: 1px solid #2563EB;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); background: #1d4ed8; }
        .btn-primary:disabled { opacity: 0.7; cursor: not-allowed; }

        /* 按钮风格 - 空心蓝 */
        .btn-outline {
            background: transparent;
            border: 1px solid #2563EB;
            color: #2563EB;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-outline:hover:not(:disabled) { background: #eff6ff; }
        .btn-outline:active:not(:disabled) { transform: scale(0.98); }
        .btn-outline:disabled { opacity: 0.5; cursor: not-allowed; border-color: #93c5fd; color: #93c5fd; }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E0E5F2; border-radius: 10px; }

        .img-container {
            position: relative;
            transition: transform 0.2s;
            border-radius: 10px;
            overflow: hidden;
        }
        .img-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(0,0,0,0.6);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            z-index: 10;
        }

        /* 标签风格 */
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
        .badge-dark { background: #2B3674; color: #ffffff; }
        .badge-blue { background: #2563EB; color: #ffffff; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 2s linear infinite; }

        /* Markdown 样式 */
        .prose { font-size: 14px; color: #2B3674; line-height: 1.6; }
        .prose h1, .prose h2, .prose h3 { color: #1B2559; font-weight: 700; margin-top: 1em; margin-bottom: 0.5em; font-size: 15px; }
        .prose ul { list-style-type: disc; padding-left: 1.2em; margin-bottom: 0.8em; }
        .prose li { margin-bottom: 0.2em; }
        .prose p { margin-bottom: 0.8em; }
        /* 针对内部思路的强调样式 */
        #outPlan.prose strong { color: #2563EB; font-weight: 700; }
        /* 针对回复函的正式样式 */
        #outReply.prose { font-family: "Songti SC", "SimSun", serif; color: #1a202c; }
    </style>
</head>
<body class="min-h-screen py-4 px-3 md:py-6 md:px-8 pb-20 md:pb-6">
    
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <header class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 md:gap-6">
            <div class="flex items-start gap-3">
                <div class="bg-gradient-to-br from-blue-600 to-blue-500 text-white p-3 rounded-xl shadow-lg flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
                    </svg>
                </div>
                <div class="flex-1">
                    <h1 class="text-2xl font-extrabold text-[#1B2559] tracking-tight">AI 客诉应对助手</h1>
                    <p class="text-[#A3AED0] text-xs font-medium flex items-center gap-2 mt-1">
                        <span class="w-2 h-2 rounded-full bg-green-400"></span>
                        <span>Doubao-Seed-1.8 Online</span>
                    </p>
                </div>
            </div>
            <!-- 桌面端操作区 -->
            <div class="hidden md:flex items-center gap-4 bg-white p-2 pr-4 rounded-[20px] shadow-sm">
                <div class="flex items-center gap-2 px-3 py-1.5">
                    <span id="statusText" class="text-xs font-bold text-[#A3AED0]">系统就绪</span>
                </div>
                <div class="h-6 w-[1px] bg-[#E0E5F2]"></div>
                <button onclick="resetAll()" class="text-xs font-bold text-red-500 hover:text-red-600 transition-colors">
                    重置内容
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8">
            <!-- 左侧输入 -->
            <div class="lg:col-span-5 space-y-4 md:space-y-6">
                <section class="modern-card p-5 md:p-6">
                    <div class="flex items-center justify-between mb-5">
                        <h2 class="text-lg font-bold text-[#1B2559]">投诉详情录入</h2>
                        <button onclick="fillStandardExample()" class="text-xs font-bold text-[#2563EB] hover:bg-blue-50 px-2 py-1 rounded transition-colors flex items-center gap-1">
                            <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> 填入示例
                        </button>
                    </div>

                    <div class="space-y-4">
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-1.5">企业类型</label>
                                <select id="corpType" class="modern-input w-full px-3 py-2.5 cursor-pointer appearance-none">
                                    <option>餐饮门店</option>
                                    <option>食品生产企业</option>
                                    <option>食品贸易/经销</option>
                                    <option>仓储物流/冷链</option>
                                    <option>其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-1.5">投诉人类型</label>
                                <select id="complainantType" class="modern-input w-full px-3 py-2.5 cursor-pointer appearance-none">
                                    <option>普通消费者</option>
                                    <option>疑似职业打假/恶意高赔</option>
                                    <option>渠道客户/经销商</option>
                                    <option>平台/媒体/监管转办</option>
                                    <option>其他</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-1.5">客诉事实描述 (含诉求) <span class="text-red-500">*</span></label>
                            <textarea id="facts" class="modern-input w-full px-4 py-3 min-h-[120px] leading-relaxed resize-none" placeholder="请描述事实及客户诉求..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-1.5">升级状态</label>
                            <select id="escalation" class="modern-input w-full px-3 py-2.5 cursor-pointer appearance-none">
                                <option value="未升级">未升级（内部处理中）</option>
                                <option value="平台介入">已升级至电商平台/三方平台</option>
                                <option value="监管介入">已升级至市监局/消协</option>
                                <option value="媒体介入">已引发媒体关注/社交平台曝光</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-1.5">附件证据 (可选)</label>
                            <div class="relative group">
                                <input type="file" id="fileInput" multiple class="hidden" accept="image/*">
                                <div onclick="document.getElementById('fileInput').click()" class="w-full border-2 border-dashed border-[#E0E5F2] rounded-xl py-4 flex flex-col items-center justify-center gap-2 active:bg-[#F4F7FE] transition-all cursor-pointer hover:border-[#2563EB]">
                                    <span class="text-xs font-bold text-[#A3AED0]">点击上传图片</span>
                                </div>
                            </div>
                            <div id="imagePreview" class="grid grid-cols-4 gap-2 mt-2"></div>
                        </div>

                        <!-- 按钮组：改为双按钮并排 -->
                        <div class="grid grid-cols-2 gap-3 pt-2">
                            <button id="btnPlan" onclick="generatePlan()" class="btn-primary py-3 text-sm flex items-center justify-center gap-2">
                                <span id="btnPlanText">生成内部思路</span>
                                <svg id="btnPlanLoader" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                            <button id="btnReply" onclick="generateReply()" class="btn-outline py-3 text-sm flex items-center justify-center gap-2">
                                <span id="btnReplyText">生成对外答复</span>
                                <svg id="btnReplyLoader" class="animate-spin h-4 w-4 text-[#2563EB] hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </section>
            </div>

            <!-- 右侧输出 -->
            <div class="lg:col-span-7 space-y-5">
                <!-- 内部应对思路 -->
                <section class="modern-card p-5 md:p-6 flex flex-col">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <h2 class="text-lg font-bold text-[#1B2559] m-0">应对思路 (对内)</h2>
                            <span class="badge badge-dark">INTERNAL ONLY</span>
                        </div>
                        <button onclick="copyResult('outPlan')" class="text-[#A3AED0] hover:text-[#2563EB] transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                    </div>
                    <div id="outPlan" class="prose max-w-none custom-scrollbar overflow-y-auto pr-2 min-h-[150px] max-h-[50vh]">
                        <div class="text-[#A3AED0] italic flex flex-col items-center justify-center py-8 opacity-50">
                            <p>点击“生成内部思路”按钮开始...</p>
                        </div>
                    </div>
                </section>

                <!-- 对外答复函 -->
                <section class="modern-card p-5 md:p-6">
                    <div class="flex items-center justify-between mb-4">
                        <div class="flex items-center gap-3">
                            <h2 class="text-lg font-bold text-[#1B2559] m-0">答复函 (对外)</h2>
                            <span class="badge badge-blue">EXTERNAL USE</span>
                        </div>
                        <button onclick="copyResult('outReply')" class="text-[#A3AED0] hover:text-[#2563EB] transition-colors">
                             <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                    </div>
                    <div id="outReply" class="prose max-w-none bg-[#F8F9FC] p-5 rounded-xl border border-[#E0E5F2] min-h-[120px]">
                        <p class="text-[#A3AED0] text-center py-8 opacity-50">内部思路生成后，点击“生成对外答复”...</p>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- 移动端重置按钮 -->
    <div class="md:hidden fixed bottom-4 right-4 z-50">
         <button onclick="resetAll()" class="bg-white text-red-500 shadow-lg rounded-full p-3 font-bold text-xs border border-gray-100">
             重置
         </button>
    </div>

    <script>
        // 配置：豆包 (Doubao) API 信息
        const apiKey = "d393f3f3-68f6-47b7-894a-fa514c3121d8"; // 您的 API Key
        const modelEndpoint = "ep-m-20260205224804-pmwxk";     // 您的 Endpoint ID

        let uploadedImages = [];
        let currentStrategyContent = ""; // 存储生成的内部思路，用于生成对外答复

        // 初始化
        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            const preview = document.getElementById('imagePreview');
            
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    const id = Math.random().toString(36).substr(2, 9);
                    
                    uploadedImages.push({ id, data: base64Data, mimeType: file.type });
                    
                    const div = document.createElement('div');
                    div.className = 'img-container relative aspect-square';
                    div.id = `img-${id}`;
                    div.innerHTML = `
                        <img src="${event.target.result}" class="w-full h-full object-cover">
                        <div class="img-remove" onclick="removeImage('${id}')">×</div>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(id) {
            uploadedImages = uploadedImages.filter(img => img.id !== id);
            const el = document.getElementById(`img-${id}`);
            if (el) el.remove();
        }

        function fillStandardExample() {
            document.getElementById('facts').value = "客户于 2023-10-24 在我司天猫旗舰店购买了 20231024 批次的坚果，拆包后自述发现一小段类似金属丝的异物（约 1.5cm）。客户称食用时划伤了口腔，但目前未提供就医证明。客户诉求：要求赔偿 1000 元，否则将向市监局投诉。";
            document.getElementById('complainantType').value = "疑似职业打假/恶意高赔";
        }

        function resetAll() {
            document.getElementById('facts').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('outPlan').innerHTML = '<div class="text-[#A3AED0] italic flex flex-col items-center justify-center py-8 opacity-50"><p>点击“生成内部思路”按钮开始...</p></div>';
            document.getElementById('outReply').innerHTML = '<p class="text-[#A3AED0] text-center py-8 opacity-50">内部思路生成后，点击“生成对外答复”...</p>';
            uploadedImages = [];
            currentStrategyContent = "";
        }

        // --- 核心功能 1：生成内部思路 ---
        async function generatePlan() {
            const f = document.getElementById('facts').value.trim();
            if (!f) { alert("请先输入客诉事实描述"); return; }

            const btn = document.getElementById('btnPlan');
            const btnText = document.getElementById('btnPlanText');
            const btnLoader = document.getElementById('btnPlanLoader');
            const outPlan = document.getElementById('outPlan');

            btn.disabled = true;
            btnText.innerText = "生成中...";
            btnLoader.classList.remove('hidden');
            
            outPlan.innerHTML = '<div class="animate-pulse flex flex-col gap-3 py-4"><div class="h-3 bg-gray-100 rounded w-3/4"></div><div class="h-3 bg-gray-100 rounded"></div><div class="h-3 bg-gray-100 rounded w-5/6"></div></div>';

            const corpType = document.getElementById('corpType').value;
            const compType = document.getElementById('complainantType').value;
            const escalation = document.getElementById('escalation').value;

            // 构造图片消息
            const parts = [];
            uploadedImages.forEach(img => {
                parts.push({
                    type: "image_url",
                    image_url: { url: `data:${img.mimeType};base64,${img.data}` }
                });
            });

            // 内部思路 Prompt - 移除专家人设，强调务实分析
            const strategyPrompt = `任务：生成【客诉内部风险评估与应对思路】。
背景信息：
- 企业类型：${corpType}
- 投诉人类型：${compType}
- 事实描述与诉求：${f}
- 升级状态：${escalation}

请输出 Markdown 格式，包含以下模块：
## 一、性质研判
(判断是普通客诉还是职业打假，给出理由)

## 二、法律风险与抗辩点
(针对事实，分析法律责任，标签瑕疵还是食安事故？)

## 三、处置建议
(具体怎么做？退货？赔偿？拒绝？)

## 四、沟通话术建议
(红线是什么？应对重点是什么？)`;

            try {
                const result = await callDoubao(strategyPrompt, parts);
                outPlan.innerHTML = marked.parse(result);
                currentStrategyContent = result; // 保存结果供下一步使用
            } catch (error) {
                console.error(error);
                outPlan.innerHTML = `<div class="p-3 bg-red-50 text-red-600 rounded text-sm">生成失败: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btnText.innerText = "生成内部思路";
                btnLoader.classList.add('hidden');
            }
        }

        // --- 核心功能 2：生成对外答复 ---
        async function generateReply() {
            const f = document.getElementById('facts').value.trim();
            if (!f) { alert("请先输入客诉事实描述"); return; }
            
            // 检查是否已生成内部思路，如果没有，虽然也可以生成，但最好提示一下，或者直接基于事实生成
            let context = `客诉事实：${f}`;
            if (currentStrategyContent) {
                context += `\n\n参考内部评估结果：\n${currentStrategyContent}`;
            } else {
                // 如果用户直接点生成答复，也可以，但效果可能不如先生成思路好
            }

            const btn = document.getElementById('btnReply');
            const btnText = document.getElementById('btnReplyText');
            const btnLoader = document.getElementById('btnReplyLoader');
            const outReply = document.getElementById('outReply');

            btn.disabled = true;
            btnText.innerText = "撰写中...";
            btnLoader.classList.remove('hidden');
            outReply.innerHTML = '<div class="animate-pulse flex flex-col gap-3 py-4"><div class="h-3 bg-gray-100 rounded w-full"></div><div class="h-3 bg-gray-100 rounded w-full"></div><div class="h-3 bg-gray-100 rounded w-2/3"></div></div>';

            const replyPrompt = `任务：基于客诉事实，撰写一封【对外正式回复函】。
要求：语气专业、克制、有理有据，不卑不亢。适合发给消费者或监管部门。不要出现“专家”等自称。

${context}

输出 Markdown 格式：
## 关于用户反馈[产品名]问题的处理说明
(正文内容...)`;

            try {
                const result = await callDoubao(replyPrompt, []); // 答复函通常不需要发图片
                outReply.innerHTML = marked.parse(result);
            } catch (error) {
                console.error(error);
                outReply.innerHTML = `<div class="p-3 bg-red-50 text-red-600 rounded text-sm">生成失败: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btnText.innerText = "生成对外答复";
                btnLoader.classList.add('hidden');
            }
        }

        // --- 通用调用函数 ---
        async function callDoubao(systemPrompt, imageParts, retries = 3) {
            const url = `https://ark.cn-beijing.volces.com/api/v3/chat/completions`;
            
            const content = [{ type: "text", text: systemPrompt }];
            if (imageParts && imageParts.length > 0) {
                imageParts.forEach(img => content.push(img));
            }

            const messages = [
                { role: "user", content: content }
            ];

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: modelEndpoint,
                            messages: messages,
                            stream: false
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.text();
                        throw new Error(`HTTP ${response.status}: ${errData}`);
                    }
                    
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content;
                    if (!content) throw new Error("API 返回结果为空");
                    return content;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        }

        async function copyResult(elementId) {
            const element = document.getElementById(elementId);
            const text = element.innerText;
            
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                // 简单的反馈动画
                const btn = event.currentTarget;
                const originalColor = btn.style.color;
                btn.style.color = '#05CD99';
                setTimeout(() => btn.style.color = originalColor, 1000);
            } catch (err) {
                console.error('无法复制', err);
            }
        }
    </script>
