<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 客诉应对助手 - 专业风控版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Plus Jakarta Sans 字体以获得更现代的外观 -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #4318FF; /* 参考图中深邃的蓝紫色 */
            --secondary: #6AD2FF;
            --accent-purple: #7551FF;
            --accent-green: #05CD99;
            --bg-color: #F4F7FE;
        }

        body {
            font-family: 'Plus Jakarta Sans', "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #2B3674; /* 深色文字 */
        }

        /* 现代卡片风格 - 大圆角，柔和阴影 */
        .modern-card {
            background: #ffffff;
            border-radius: 30px; /* 30px 大圆角 */
            box-shadow: 0px 20px 40px rgba(112, 144, 176, 0.08);
            border: none;
            transition: all 0.3s ease;
        }

        /* 输入框风格 - 极简，无边框，浅背景 */
        .modern-input {
            background-color: #F8F9FC; /* 极浅的灰蓝背景 */
            border: 1px solid transparent;
            border-radius: 16px;
            color: #2B3674;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .modern-input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
        }
        .modern-input::placeholder {
            color: #A3AED0;
        }

        /* 按钮风格 */
        .btn-primary {
            background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
            border-radius: 16px;
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(67, 24, 255, 0.3);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-secondary {
            background: #fff;
            color: var(--primary);
            border: 2px solid #F4F7FE;
            border-radius: 16px;
            font-weight: 700;
        }
        .btn-secondary:hover:not(:disabled) {
            background: #F4F7FE;
            color: #2B3674;
        }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #E0E5F2;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #A3AED0;
        }

        .img-container {
            position: relative;
            transition: transform 0.2s;
            border-radius: 14px;
            overflow: hidden;
        }
        .img-container:hover {
            transform: scale(1.05);
        }
        .img-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            cursor: pointer;
            backdrop-filter: blur(2px);
        }

        /* 标签风格 */
        .badge {
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .badge-purple { background: #F4F0FF; color: #4318FF; }
        .badge-green { background: #E6FFFA; color: #05CD99; }
        .badge-blue { background: #EBF8FF; color: #2B6CB0; }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .animate-spin-slow { animation: spin 2s linear infinite; }
    </style>
</head>
<body class="min-h-screen py-6 px-4 md:px-8">
    
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部导航 -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div class="flex flex-col">
                <div class="flex items-center gap-4">
                    <!-- 图标背景改为柔和的圆角矩形 -->
                    <div class="bg-gradient-to-br from-[#05CD99] to-[#02A676] text-white p-3.5 rounded-[20px] shadow-lg shadow-emerald-100">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-extrabold text-[#1B2559] tracking-tight">AI 客诉应对助手</h1>
                        <p class="text-[#A3AED0] text-sm mt-1 font-medium">
                            作者：李川 <span class="mx-2">|</span> 如有疑问可企业微信联系我
                        </p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center gap-4 bg-white p-2 pr-4 rounded-[20px] shadow-sm">
                <div id="statusIndicator" class="flex items-center gap-2 px-3 py-1.5">
                    <div class="relative flex h-3 w-3">
                      <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75 hidden"></span>
                      <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-[#05CD99]"></span>
                    </div>
                    <span id="statusText" class="text-xs font-bold text-[#A3AED0]">系统就绪</span>
                </div>
                <div class="h-6 w-[1px] bg-[#E0E5F2]"></div>
                <button onclick="resetAll()" class="text-xs font-bold text-[#E02020] hover:text-red-600 transition-colors flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                    重置
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            <!-- 左侧：输入区域 -->
            <div class="lg:col-span-5 space-y-6">
                <!-- 详情录入卡片 -->
                <section class="modern-card p-8">
                    <div class="flex items-center justify-between mb-8">
                        <h2 class="text-xl font-bold text-[#1B2559]">投诉详情录入</h2>
                        <div class="bg-[#F4F7FE] p-2 rounded-xl text-[#4318FF]">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </div>
                    </div>

                    <div class="space-y-6">
                        <div class="grid grid-cols-2 gap-5">
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">企业类型</label>
                                <select id="corpType" class="modern-input w-full px-4 py-3.5 text-sm cursor-pointer appearance-none">
                                    <option>食品生产企业</option>
                                    <option>餐饮门店</option>
                                    <option>食品贸易/经销</option>
                                    <option>仓储物流/冷链</option>
                                    <option>其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">投诉人类型</label>
                                <select id="complainantType" class="modern-input w-full px-4 py-3.5 text-sm cursor-pointer appearance-none">
                                    <option>普通消费者</option>
                                    <option>疑似职业打假/恶意高赔</option>
                                    <option>渠道客户/经销商</option>
                                    <option>平台/媒体/监管转办</option>
                                    <option>其他</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase tracking-wide">
                                    客诉描述 <span class="text-[#E02020]">*</span>
                                </label>
                                <button onclick="fillStandardExample()" class="text-xs font-bold text-[#4318FF] hover:underline flex items-center gap-1">
                                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                                    填入示例
                                </button>
                            </div>
                            <textarea id="facts" class="modern-input w-full px-5 py-4 text-sm min-h-[160px] leading
