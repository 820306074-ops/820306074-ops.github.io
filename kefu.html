<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 客诉应对助手 - 豆包专业版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #4318FF; 
            --secondary: #6AD2FF;
            --accent-purple: #7551FF;
            --accent-green: #05CD99;
            --bg-color: #F4F7FE;
        }

        body {
            font-family: 'Plus Jakarta Sans', "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            color: #2B3674;
            -webkit-overflow-scrolling: touch;
        }

        /* 现代卡片风格 */
        .modern-card {
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0px 10px 30px rgba(112, 144, 176, 0.08);
            border: none;
            transition: all 0.3s ease;
        }
        @media (min-width: 768px) {
            .modern-card { border-radius: 30px; box-shadow: 0px 20px 40px rgba(112, 144, 176, 0.08); }
        }

        /* 输入框风格 */
        .modern-input {
            background-color: #F8F9FC;
            border: 1px solid transparent;
            border-radius: 16px;
            color: #2B3674;
            font-weight: 500;
            transition: all 0.2s ease;
            font-size: 16px; 
        }
        @media (min-width: 768px) { .modern-input { font-size: 14px; } }
        
        .modern-input:focus {
            background-color: #ffffff;
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(67, 24, 255, 0.1);
        }
        .modern-input::placeholder { color: #A3AED0; }

        /* 按钮风格 */
        .btn-primary {
            background: linear-gradient(135deg, #868CFF 0%, #4318FF 100%);
            border-radius: 16px;
            color: white;
            font-weight: 700;
            box-shadow: 0 10px 20px rgba(67, 24, 255, 0.2);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
        }
        .btn-primary:active:not(:disabled) { transform: scale(0.98); }

        .btn-secondary {
            background: #fff;
            color: var(--primary);
            border: 2px solid #F4F7FE;
            border-radius: 16px;
            font-weight: 700;
            transition: transform 0.2s, background-color 0.2s, opacity 0.2s;
        }
        .btn-secondary:active:not(:disabled) { background: #F4F7FE; }

        /* 滚动条美化 */
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E0E5F2; border-radius: 10px; }

        .img-container {
            position: relative;
            transition: transform 0.2s;
            border-radius: 14px;
            overflow: hidden;
        }
        .img-remove {
            position: absolute;
            top: 2px;
            right: 2px;
            background: rgba(239, 68, 68, 0.95);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            backdrop-filter: blur(2px);
            z-index: 10;
        }

        /* 标签风格 */
        .badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.5px; }
        @media (min-width: 768px) { .badge { padding: 6px 14px; font-size: 12px; border-radius: 10px; } }
        .badge-purple { background: #F4F0FF; color: #4318FF; }
        .badge-green { background: #E6FFFA; color: #05CD99; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-spin-slow { animation: spin 2s linear infinite; }

        /* Markdown 样式 */
        .prose { font-size: 14px; color: #2B3674; line-height: 1.75; }
        .prose h1, .prose h2, .prose h3, .prose h4 { color: #1B2559; font-weight: 700; margin-top: 1.2em; margin-bottom: 0.5em; }
        .prose ul, .prose ol { margin-bottom: 1em; padding-left: 1.25em; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose li { margin-bottom: 0.4em; }
        .prose blockquote { border-left: 4px solid #E0E5F2; padding-left: 1em; color: #64748B; font-style: italic; background: #F8FAFC; padding: 8px; border-radius: 4px; margin-bottom: 16px; font-size: 13px; }
        #outPlan.prose strong { color: #4318FF; font-weight: 700; background-color: #F4F0FF; padding: 1px 4px; border-radius: 4px; }
        #outReply.prose { font-family: "Songti SC", "SimSun", serif; font-size: 15px; line-height: 1.8; color: #1a202c; }
        #outReply.prose strong { font-weight: 600; color: #000; text-decoration: underline; text-decoration-color: #cbd5e0; text-underline-offset: 4px; }
    </style>
</head>
<body class="min-h-screen py-4 px-3 md:py-6 md:px-8 pb-20 md:pb-6">
    
    <div class="max-w-[1400px] mx-auto">
        <!-- 头部 -->
        <header class="mb-6 flex flex-col md:flex-row md:items-center justify-between gap-4 md:gap-6">
            <div class="flex items-start gap-3">
                <div class="bg-gradient-to-br from-[#05CD99] to-[#02A676] text-white p-3 rounded-2xl shadow-lg shadow-emerald-100 flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75L11.25 15 15 9.75M21 12c0 1.268-.63 2.39-1.593 3.068a3.745 3.745 0 01-1.043 3.296 3.745 3.745 0 01-3.296 1.043A3.745 3.745 0 0112 21c-1.268 0-2.39-.63-3.068-1.593a3.746 3.746 0 01-3.296-1.043 3.745 3.745 0 01-1.043-3.296A3.745 3.745 0 013 12c0-1.268.63-2.39 1.593-3.068a3.745 3.745 0 011.043-3.296 3.746 3.746 0 013.296-1.043A3.746 3.746 0 0112 3c1.268 0 2.39.63 3.068 1.593a3.746 3.746 0 013.296 1.043 3.746 3.746 0 011.043 3.296A3.745 3.745 0 0121 12z" />
                    </svg>
                </div>
                <div class="flex-1">
                    <h1 class="text-2xl md:text-3xl font-extrabold text-[#1B2559] tracking-tight leading-tight">AI 客诉应对助手</h1>
                    <p class="text-[#A3AED0] text-xs md:text-sm mt-1 font-medium flex flex-wrap gap-x-2">
                        <span>作者：李川</span>
                        <span class="hidden md:inline">|</span>
                        <span>模型：Doubao-Seed-1.8 (火山引擎)</span>
                    </p>
                </div>
            </div>
            <!-- 桌面端操作区 -->
            <div class="hidden md:flex items-center gap-4 bg-white p-2 pr-4 rounded-[20px] shadow-sm">
                <!-- 移除了输入框，因为已内置 Key -->
                <div class="flex items-center gap-2 px-3 py-1.5">
                    <div class="relative flex h-3 w-3">
                      <span id="statusPing" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75 hidden"></span>
                      <span id="statusDot" class="relative inline-flex rounded-full h-3 w-3 bg-[#05CD99]"></span>
                    </div>
                    <span id="statusText" class="text-xs font-bold text-[#A3AED0]">系统就绪</span>
                </div>
                <div class="h-6 w-[1px] bg-[#E0E5F2]"></div>
                <button onclick="resetAll()" class="text-xs font-bold text-[#E02020] hover:text-red-600 transition-colors flex items-center gap-1">
                    重置
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 md:gap-8">
            <!-- 左侧输入 -->
            <div class="lg:col-span-5 space-y-4 md:space-y-6">
                <section class="modern-card p-5 md:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <h2 class="text-lg md:text-xl font-bold text-[#1B2559]">投诉详情录入</h2>
                        <div class="bg-[#F4F7FE] p-2 rounded-xl text-[#4318FF]">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </div>
                    </div>

                    <div class="space-y-5">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-5">
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">企业类型</label>
                                <select id="corpType" class="modern-input w-full px-4 py-3.5 cursor-pointer appearance-none">
                                    <option>食品生产企业</option>
                                    <option>餐饮门店</option>
                                    <option>食品贸易/经销</option>
                                    <option>仓储物流/冷链</option>
                                    <option>其他</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">投诉人疑似</label>
                                <select id="complainantType" class="modern-input w-full px-4 py-3.5 cursor-pointer appearance-none">
                                    <option>普通消费者</option>
                                    <option>疑似职业打假/恶意高赔</option>
                                    <option>渠道客户/经销商</option>
                                    <option>平台/媒体/监管转办</option>
                                    <option>其他</option>
                                </select>
                            </div>
                        </div>

                        <div>
                            <div class="flex justify-between items-center mb-2">
                                <label class="block text-xs font-bold text-[#A3AED0] uppercase tracking-wide">客诉事实描述 (含诉求) <span class="text-[#E02020]">*</span></label>
                                <button onclick="fillStandardExample()" class="text-xs font-bold text-[#4318FF] active:opacity-70 flex items-center gap-1 px-2 py-1 -mr-2">
                                    <svg class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg> 填入示例
                                </button>
                            </div>
                            <textarea id="facts" class="modern-input w-full px-5 py-4 min-h-[140px] leading-relaxed resize-none" placeholder="请描述事实及客户诉求，例如：发生时间、批次、异物描述、客户要求赔偿金额..."></textarea>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">升级状态</label>
                            <select id="escalation" class="modern-input w-full px-4 py-3.5 cursor-pointer appearance-none">
                                <option value="未升级">未升级（内部处理中）</option>
                                <option value="平台介入">已升级至电商平台/三方平台</option>
                                <option value="监管介入">已升级至市监局/消协</option>
                                <option value="媒体介入">已引发媒体关注/社交平台曝光</option>
                            </select>
                        </div>

                        <div>
                            <label class="block text-xs font-bold text-[#A3AED0] uppercase mb-2 tracking-wide">附件证据</label>
                            <div class="relative group">
                                <input type="file" id="fileInput" multiple class="hidden" accept="image/*">
                                <div onclick="document.getElementById('fileInput').click()" class="w-full border-2 border-dashed border-[#E0E5F2] rounded-2xl py-6 flex flex-col items-center justify-center gap-3 active:bg-[#F4F7FE] transition-all cursor-pointer">
                                    <div class="w-10 h-10 bg-[#F4F7FE] rounded-full flex items-center justify-center text-[#4318FF]">
                                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                                    </div>
                                    <span class="text-xs font-bold text-[#A3AED0]">点击上传图片证据（可选）</span>
                                </div>
                            </div>
                            <div id="imagePreview" class="grid grid-cols-4 gap-2 mt-3"></div>
                        </div>

                        <button id="generateBtn" onclick="analyzeComplaint()" class="btn-primary w-full py-4 text-lg flex items-center justify-center gap-3">
                            <span id="btnText">开始专家研判 (Doubao)</span>
                            <div id="btnLoader" class="hidden">
                                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                </svg>
                            </div>
                        </button>
                    </div>
                </section>
            </div>

            <!-- 右侧输出 -->
            <div class="lg:col-span-7 space-y-6">
                <!-- 内部应对策略 -->
                <section class="modern-card p-5 md:p-8 flex flex-col h-full">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <span class="badge badge-purple">内部应对策略</span>
                            <h2 class="text-lg md:text-xl font-bold text-[#1B2559]">法务风控深度研判</h2>
                        </div>
                        <button id="copyBtnPlan" onclick="copyResult('outPlan')" class="text-[#4318FF] hover:bg-[#F4F0FF] p-2 rounded-lg transition-colors">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                    </div>
                    <div id="outPlan" class="prose max-w-none flex-1 custom-scrollbar overflow-y-auto pr-2" style="max-height: 400px;">
                        <div class="text-[#A3AED0] italic flex flex-col items-center justify-center py-20 opacity-50">
                            <svg class="w-16 h-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <p>输入投诉信息后，在此查看内部策略...</p>
                        </div>
                    </div>
                </section>

                <!-- 对外正式回复函 -->
                <section class="modern-card p-5 md:p-8">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <span class="badge badge-green">对外正式回复函</span>
                            <h2 class="text-lg md:text-xl font-bold text-[#1B2559]">公关专家撰写</h2>
                        </div>
                        <button id="copyBtnReply" onclick="copyResult('outReply')" class="text-[#05CD99] hover:bg-[#E6FFFA] p-2 rounded-lg transition-colors">
                             <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        </button>
                    </div>
                    <div id="outReply" class="prose max-w-none bg-[#F8F9FC] p-6 rounded-2xl border border-[#E0E5F2] min-h-[150px]">
                        <p class="text-[#A3AED0] text-center py-10">等待内部策略生成后自动拟定...</p>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- 移动端浮动操作栏 -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 p-4 bg-white/80 backdrop-blur-md border-t border-[#E0E5F2] flex items-center justify-between z-50">
         <div class="flex justify-between items-center w-full">
             <button onclick="resetAll()" class="text-sm font-bold text-[#E02020] px-4">重置</button>
             <div class="flex items-center gap-2">
                 <div class="h-2 w-2 rounded-full bg-[#05CD99]"></div>
                 <span class="text-[10px] font-bold text-[#A3AED0]">READY</span>
             </div>
         </div>
    </div>

    <script>
        // 配置：豆包 (Doubao) API 信息
        const apiKey = "d393f3f3-68f6-47b7-894a-fa514c3121d8"; // 您的 API Key
        const modelEndpoint = "ep-m-20260205224804-pmwxk";     // 您的 Endpoint ID

        let uploadedImages = [];

        // 初始化
        document.getElementById('fileInput').addEventListener('change', handleFiles);

        function handleFiles(e) {
            const files = Array.from(e.target.files);
            const preview = document.getElementById('imagePreview');
            
            files.forEach(file => {
                if (!file.type.startsWith('image/')) return;
                
                const reader = new FileReader();
                reader.onload = (event) => {
                    const base64Data = event.target.result.split(',')[1];
                    const id = Math.random().toString(36).substr(2, 9);
                    
                    uploadedImages.push({ id, data: base64Data, mimeType: file.type });
                    
                    const div = document.createElement('div');
                    div.className = 'img-container relative aspect-square';
                    div.id = `img-${id}`;
                    div.innerHTML = `
                        <img src="${event.target.result}" class="w-full h-full object-cover">
                        <div class="img-remove" onclick="removeImage('${id}')">×</div>
                    `;
                    preview.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeImage(id) {
            uploadedImages = uploadedImages.filter(img => img.id !== id);
            const el = document.getElementById(`img-${id}`);
            if (el) el.remove();
        }

        function fillStandardExample() {
            document.getElementById('facts').value = "客户于 2023-10-24 在我司天猫旗舰店购买了 20231024 批次的坚果，拆包后自述发现一小段类似金属丝的异物（约 1.5cm）。客户称食用时划伤了口腔，但目前未提供就医证明。客户诉求：要求赔偿 1000 元，否则将向市监局投诉。";
            document.getElementById('complainantType').value = "疑似职业打假/恶意高赔";
        }

        function resetAll() {
            document.getElementById('facts').value = '';
            document.getElementById('imagePreview').innerHTML = '';
            document.getElementById('outPlan').innerHTML = '<div class="text-[#A3AED0] italic flex flex-col items-center justify-center py-20 opacity-50"><svg class="w-16 h-16 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg><p>已重置，等待输入...</p></div>';
            document.getElementById('outReply').innerHTML = '<p class="text-[#A3AED0] text-center py-10">等待分析完成...</p>';
            uploadedImages = [];
        }

        async function analyzeComplaint() {
            const f = document.getElementById('facts').value.trim();
            if (!f) {
                alert("请输入事实描述");
                return;
            }

            const btn = document.getElementById('generateBtn');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');
            const statusPing = document.getElementById('statusPing');
            const statusText = document.getElementById('statusText');
            const outPlan = document.getElementById('outPlan');
            const outReply = document.getElementById('outReply');

            // UI 状态切换
            btn.disabled = true;
            btnLoader.classList.remove('hidden');
            statusPing.classList.remove('hidden');

            const corpType = document.getElementById('corpType').value;
            const compType = document.getElementById('complainantType').value;
            const escalation = document.getElementById('escalation').value;

            // 准备共用内容（构造 OpenAI 兼容的消息格式）
            const parts = [];
            
            uploadedImages.forEach(img => {
                parts.push({
                    type: "image_url",
                    image_url: {
                        url: `data:${img.mimeType};base64,${img.data}`
                    }
                });
            });

            try {
                // 第一步：生成内部应对策略
                btnText.innerText = "法务风控正在研判 (Doubao)...";
                statusText.innerText = "法务风控正在研判...";
                outPlan.innerHTML = '<div class="animate-pulse flex flex-col gap-4 py-10"><div class="h-4 bg-gray-100 rounded w-3/4"></div><div class="h-4 bg-gray-100 rounded"></div><div class="h-4 bg-gray-100 rounded w-5/6"></div></div>';
                outReply.innerHTML = '<p class="text-[#A3AED0] text-center py-10 italic">等待内部思路生成中...</p>';

                const strategyPrompt = `角色：食品企业法务风控专家。  
任务：生成【内部应对策略】（不对外）。  
背景信息：  
- 企业类型：${corpType}  
- 投诉人疑似：${compType}  
- 事实描述：${f}  
- 升级状态：${escalation}

请输出 Markdown 格式，包含：  
## 一、性质研判  
(判断是普通客诉还是职业打假，给出理由)  

## 二、法律风险与抗辩点

        async function callDoubao(systemPrompt, imageParts, retries = 3) {
            // 火山引擎 (Volcengine) OpenAI 兼容接口
            const url = `https://ark.cn-beijing.volces.com/api/v3/chat/completions`;
            
            // 构造消息体
            const content = [{ type: "text", text: systemPrompt }];
            if (imageParts && imageParts.length > 0) {
                // 如果是支持视觉的模型，这里会生效；如果是纯文本模型，可能忽略或报错
                imageParts.forEach(img => content.push(img));
            }

            const messages = [
                {
                    role: "user",
                    content: content
                }
            ];

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: modelEndpoint,
                            messages: messages,
                            stream: false
                        })
                    });
                    
                    if (!response.ok) {
                        const errData = await response.text();
                        throw new Error(`HTTP error! status: ${response.status}, detail: ${errData}`);
                    }
                    
                    const data = await response.json();
                    const content = data.choices?.[0]?.message?.content;
                    if (!content) throw new Error("API 返回结果为空");
                    return content;
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(r => setTimeout(r, Math.pow(2, i) * 1000));
                }
            }
        }

        async function copyResult(elementId) {
            const element = document.getElementById(elementId);
            const text = element.innerText;
            
            try {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                
                const btn = event.currentTarget;
                const originalHTML = btn.innerHTML;
                btn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>';
                setTimeout(() => btn.innerHTML = originalHTML, 2000);
            } catch (err) {
                console.error('无法复制', err);
            }
        }
    </script>
